services:
  jxtd:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # SQLite 使用 datetime('now','localtime') 写业务时间；生产统一设置为上海时区。
      # ADMIN_PASSWORD 只在空 admins 表首次引导时使用，已有账号不会被覆盖。
      - TZ=Asia/Shanghai
      # 该文件位于 SQLite 之外，是投递码防回退护栏，必须随 runtime/ 一起备份。
      - CODE_SEQUENCE_FLOOR_FILE=/runtime/code-sequence-high-water.json
    volumes:
      - ./data:/data
      - ./uploads:/uploads
      # data、uploads、runtime 都是持久化目录；不要用旧数据库直接覆盖 data/。
      - ./runtime:/runtime
    expose:
      - "3000"
    networks:
      - upload-api_upload

networks:
  upload-api_upload:
    external: true
